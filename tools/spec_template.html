<title>vfio_nvme 仕様書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f6f7f9;
  --surface:#ffffff;
  --rail:#eef1f5;
  --ink:#101720;
  --ink-2:#455160;
  --ink-3:#78838f;
  --line:#dde2e9;
  --line-2:#c8d0da;
  --accent:#0f4c81;
  --accent-2:#1a6ba8;
  --accent-wash:#e8eff6;
  --ok:#1f7a4c;
  --warn:#a15c05;
  --off:#6b7480;
  --code-bg:#eef1f5;
  --quote-bg:#f0f3f7;
  --shadow:0 1px 2px rgba(16,23,32,.06),0 8px 24px rgba(16,23,32,.05);
  --measure:69ch;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1218;
    --surface:#121922;
    --rail:#0f151d;
    --ink:#e3e9f0;
    --ink-2:#a7b3c1;
    --ink-3:#7c8895;
    --line:#202934;
    --line-2:#2c3745;
    --accent:#6aa9dd;
    --accent-2:#8cc0ea;
    --accent-wash:#16222e;
    --ok:#4bb07c;
    --warn:#d19a3e;
    --off:#8b95a1;
    --code-bg:#0b1016;
    --quote-bg:#141c25;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1218;
  --surface:#121922;
  --rail:#0f151d;
  --ink:#e3e9f0;
  --ink-2:#a7b3c1;
  --ink-3:#7c8895;
  --line:#202934;
  --line-2:#2c3745;
  --accent:#6aa9dd;
  --accent-2:#8cc0ea;
  --accent-wash:#16222e;
  --ok:#4bb07c;
  --warn:#d19a3e;
  --off:#8b95a1;
  --code-bg:#0b1016;
  --quote-bg:#141c25;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:15.5px;
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
.shell{display:flex;align-items:flex-start;min-height:100vh}

/* ---------- 左ナビ ---------- */
.rail{
  position:sticky;top:0;flex:0 0 302px;width:302px;height:100vh;
  background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.railhead{padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.doctitle{
  font-size:15px;font-weight:700;letter-spacing:.01em;margin:0;line-height:1.45;
}
.docsub{
  margin:5px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
}
.filterwrap{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
#filter{
  width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:5px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:13px;
}
#filter::placeholder{color:var(--ink-3)}
#filter:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

.navscroll{overflow-y:auto;flex:1;padding:10px 10px 40px}
.navscroll ul{list-style:none;margin:0;padding:0}
.navpart{margin:0 0 4px}
.navpartlink{
  display:block;padding:9px 10px 5px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);text-decoration:none;
}
.navpartlink:hover{color:var(--accent)}
.navpart > ul > li > a{
  display:flex;gap:9px;align-items:baseline;
  padding:5px 10px;border-radius:5px;
  color:var(--ink-2);text-decoration:none;font-size:13.2px;line-height:1.5;
  border-left:2px solid transparent;
}
.navpart > ul > li > a:hover{background:var(--accent-wash);color:var(--ink)}
.navpart > ul > li > a.active{
  background:var(--accent-wash);color:var(--accent);font-weight:600;
  border-left-color:var(--accent);
}
.num{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--ink-3);min-width:1.6em;text-align:right;flex:0 0 auto;
}
.navpart > ul > li > a.active .num{color:var(--accent)}
.lbl{flex:1}

/* ---------- 本文 ---------- */
.main{flex:1;min-width:0;padding:0 0 120px}
.progress{position:sticky;top:0;height:2px;background:transparent;z-index:5}
.progress > span{display:block;height:100%;width:0;background:var(--accent)}
.content{max-width:var(--measure);margin:0 auto;padding:44px 32px 0}

h1{font-size:29px;line-height:1.4;font-weight:700;letter-spacing:-.01em;margin:0 0 18px;text-wrap:balance}
.parthead{
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  color:var(--accent);margin:64px 0 6px;padding-bottom:8px;border-bottom:2px solid var(--accent);
}
.chaphead{
  font-size:22.5px;font-weight:700;line-height:1.5;margin:46px 0 14px;
  letter-spacing:-.005em;text-wrap:balance;scroll-margin-top:24px;
}
h4{font-size:16.5px;font-weight:600;margin:32px 0 8px;line-height:1.6;text-wrap:balance}
h5{font-size:14.5px;font-weight:600;margin:22px 0 6px;color:var(--ink-2)}
p{margin:0 0 15px}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 32%,transparent)}
a:hover{border-bottom-color:var(--accent)}
a:focus-visible,.navpart a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
strong{font-weight:600;color:var(--ink)}
hr{border:0;border-top:1px solid var(--line);margin:38px 0}
ul,ol{margin:0 0 15px;padding-left:1.5em}
li{margin:0 0 6px}
li::marker{color:var(--ink-3)}

code{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.875em;
  background:var(--code-bg);padding:.12em .38em;border-radius:3px;
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
}
.codewrap{overflow-x:auto;margin:0 0 18px;background:var(--code-bg);border:1px solid var(--line);border-radius:6px}
.codewrap pre{margin:0;padding:15px 17px;line-height:1.62}
.codewrap code{background:none;border:0;padding:0;font-size:12.6px;white-space:pre}

blockquote{
  margin:0 0 18px;padding:13px 17px;background:var(--quote-bg);
  border-left:3px solid var(--accent);border-radius:0 5px 5px 0;
}
blockquote p{margin:0 0 8px}
blockquote p:last-child{margin:0}

.tablewrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.4px;line-height:1.72}
th,td{padding:9px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{
  background:var(--accent-wash);font-weight:600;font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);white-space:nowrap;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
}
tbody tr:last-child td{border-bottom:0}
td code{font-size:12.2px}
td:first-child{white-space:normal}

/* 実装状況の表に出る語を色で拾う(意味を形にする) */
td strong{color:var(--ink)}

.topbar{display:none}
.railtoggle{display:none}

@media (max-width:900px){
  .shell{display:block}
  .rail{
    position:fixed;z-index:20;left:0;top:0;height:100vh;width:290px;flex:none;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow);
  }
  .rail.open{transform:none}
  .topbar{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;
    background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;
  }
  .railtoggle{
    display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--line-2);
    color:var(--ink);border-radius:6px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;
  }
  .topbar .tt{font-size:13.5px;font-weight:600}
  .content{padding:26px 18px 0}
  h1{font-size:24px}
  .chaphead{font-size:20px;scroll-margin-top:60px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;scroll-behavior:auto !important}
}
html{scroll-behavior:smooth}
</style>

<div class="topbar">
  <button class="railtoggle" id="toggle" aria-label="章の一覧を開閉">目次</button>
  <span class="tt">vfio_nvme 仕様書</span>
</div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="章の一覧">
    <div class="railhead">
      <p class="doctitle">vfio_nvme 仕様書</p>
      <p class="docsub">29 chapters &middot; 3 appendices</p>
    </div>
    <div class="filterwrap">
      <input id="filter" type="search" placeholder="章を絞り込む" autocomplete="off">
    </div>
    <div class="navscroll">
      <ul id="navroot">
<!--NAV-->
      </ul>
    </div>
  </nav>

  <main class="main">
    <div class="progress"><span id="bar"></span></div>
    <div class="content">
<!--BODY-->
    </div>
  </main>
</div>

<script>
(function(){
  var links = Array.prototype.slice.call(document.querySelectorAll('.navpart > ul > li > a'));
  var map = {};
  links.forEach(function(a){ map[a.getAttribute('data-target')] = a; });

  // 現在読んでいる章をハイライトする
  var heads = Array.prototype.slice.call(document.querySelectorAll('.chaphead[id]'));
  var current = null;
  function mark(id){
    if(current === id) return;
    current = id;
    links.forEach(function(a){ a.classList.remove('active'); });
    var a = map[id];
    if(a){
      a.classList.add('active');
      var r = a.getBoundingClientRect(), box = document.querySelector('.navscroll').getBoundingClientRect();
      if(r.top < box.top + 8 || r.bottom > box.bottom - 8) a.scrollIntoView({block:'center'});
    }
  }
  function onScroll(){
    var best = null, bestTop = -Infinity;
    for(var i=0;i<heads.length;i++){
      var t = heads[i].getBoundingClientRect().top;
      if(t <= 120 && t > bestTop){ bestTop = t; best = heads[i]; }
    }
    if(!best && heads.length) best = heads[0];
    if(best) mark(best.id);

    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    document.getElementById('bar').style.width = (max > 0 ? (doc.scrollTop / max * 100) : 0) + '%';
  }
  document.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  // 絞り込み
  var filter = document.getElementById('filter');
  filter.addEventListener('input', function(){
    var q = filter.value.trim().toLowerCase();
    document.querySelectorAll('.navpart').forEach(function(part){
      var any = false;
      part.querySelectorAll('li').forEach(function(li){
        var hit = !q || li.textContent.toLowerCase().indexOf(q) >= 0;
        li.style.display = hit ? '' : 'none';
        if(hit) any = true;
      });
      part.style.display = any ? '' : 'none';
    });
  });

  // 狭い画面での開閉
  var rail = document.getElementById('rail'), toggle = document.getElementById('toggle');
  if(toggle){
    toggle.addEventListener('click', function(){ rail.classList.toggle('open'); });
    rail.addEventListener('click', function(e){
      if(e.target.tagName === 'A' && window.innerWidth <= 900) rail.classList.remove('open');
    });
  }
})();
</script>
